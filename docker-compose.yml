# Privacy Sentinel AI - Phase 0 Development Stack
version: '3.8'

services:
  # FastAPI Backend
  fastapi:
    build: 
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://dev:dev@postgres:5432/privacy_sentinel
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-privacy_sentinel}
      - DB_HOST=postgres
      - DB_NAME=privacy_sentinel
      - DB_USER=dev
      - DB_PASSWORD=dev
      - DB_NAME=${POSTGRES_DB:-privacy_sentinel}
      - DB_USER=${POSTGRES_USER:-dev}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-dev}
      - REDIS_URL=redis://redis:6379
      - LLM_MODE=development
      - LOG_LEVEL=info
      - LLM_MODE=${LLM_MODE:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./agent:/app
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - privacy-net

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: privacy_sentinel
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POOL_BASE_URL: jdbc:postgresql://postgres:5432/privacy_sentinel
    ports:
      - "5432:5432"
      POSTGRES_DB: ${POSTGRES_DB:-privacy_sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - privacy-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d privacy_sentinel"]
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dev} -d $${POSTGRES_DB:-privacy_sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama for Local LLM
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - privacy-net
    restart: unless-stopped

  # n8n for Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflows:/home/node/workflows
    networks:
      - privacy-net
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - privacy-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    profiles:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - fastapi
    restart: unless-stopped
    networks:
      - privacy-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  n8n_data:
    driver: local

networks:
  privacy-net:
    driver: bridge
