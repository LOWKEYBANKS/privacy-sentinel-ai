services:
  - type: web
    name: privacy-sentinel-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd agent && gunicorn -w 4 -k uvicorn.workers.UvicornWorker api.summarizer:app --bind 0.0.0.0:10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: privacy-sentinel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: privacy-sentinel-redis
          property: connectionString
      - key: LLM_MODE
        value: production
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: privacy-sentinel-db
    plan: free

redis:
  - name: privacy-sentinel-redis
    plan: free
    ipAllowList: [] # Only allow internal connections
