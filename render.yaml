services:
  - type: web
    name: privacy-sentinel-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd agent && gunicorn -w 4 -k uvicorn.workers.UvicornWorker api.summarizer:app --bind 0.0.0.0:10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: privacy-sentinel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: privacy-sentinel-redis
          property: connectionString
      - key: LLM_MODE
        value: production
      - key: OPENAI_API_KEY
        sync: false

  - type: keyvalue
    name: privacy-sentinel-redis
    region: oregon
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: privacy-sentinel-db
    plan: free
    region: oregon
