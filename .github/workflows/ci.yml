name: Privacy Sentinel AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        # lexnlp==2.3.0 pulls gensim==4.1.2, which fails to build metadata on Python 3.11
        # in GitHub Actions (AttributeError: 'dict' object has no attribute '__NUMPY_SETUP__').
        # Python 3.10 avoids that packaging break and keeps CI stable.
        python-version: '3.10'
        
        - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pin numpy to avoid gensim build error
        pip install "numpy<2.0.0"
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Run tests
      run: |
        # We set a dummy DB URL for testing purposes
        export DATABASE_URL=postgresql://dev:dev@localhost:5432/privacy_sentinel
        pytest tests/
