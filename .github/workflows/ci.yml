name: Privacy Sentinel AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "numpy<2.0.0" "setuptools<70.0.0" "Cython<3.0.0"
        pip install -r requirements.txt
        playwright install
        
        - name: Run tests
      run: |
        export DATABASE_URL=postgresql://dev:dev@localhost:5432/privacy_sentinel
        # Set PYTHONPATH so tests can find the agent module
        export PYTHONPATH=$PYTHONPATH:$(pwd)/agent
        pytest tests/
