name: 🚀 Production Deployment

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["Privacy Sentinel AI CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    # Only run if tests passed or it's a direct push to main
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    
    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/privacy-sentinel-agent:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/privacy-sentinel-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
